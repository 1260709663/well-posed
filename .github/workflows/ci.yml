name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 规范校验与语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 校验 SKILL.md（frontmatter / name 规则 / 内部引用）
        run: python scripts/validate_skill.py .

      - name: 脚本语法检查
        run: python -m py_compile scripts/prep.py scripts/build_pdf.py scripts/validate_skill.py scripts/doctor.py

      - name: 环境自检冒烟（runner 上无 LaTeX，应判为 markdown-only 且不崩溃）
        run: |
          python scripts/doctor.py || true
          python scripts/doctor.py --json | python -c "import sys,json; d=json.load(sys.stdin); assert d['level'] in ('full','markdown-only','host-read-only'); print('doctor level =', d['level'])"

      - name: 安装 PyMuPDF 并检查 prep.py 可运行
        run: |
          python -m pip install --quiet pymupdf
          python scripts/prep.py --help

  latex:
    name: 模板编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # fontset=windows 只在 Windows 可用；CI 上换成随 ctex 分发的 fandol
      - name: 切换中文字体集
        run: sed 's/fontset=windows/fontset=fandol/' assets/template.tex > template-ci.tex

      - name: 编译模板
        uses: xu-cheng/latex-action@v3
        with:
          root_file: template-ci.tex
          args: -xelatex -interaction=nonstopmode -halt-on-error

      - name: 确认产出了 PDF
        run: test -s template-ci.pdf && echo "模板编译成功"

      - uses: actions/upload-artifact@v4
        with:
          name: template-preview
          path: template-ci.pdf
          retention-days: 7
